<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#06061a">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="description" content="WilsonTV — Control remoto para tu Smart TV">
    <title>WilsonTV — Control Remoto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/remote.css?v=8">
</head>
<body>

    <!-- ═══════ PAIRING SCREEN ═══════ -->
    <div id="screen-pair" class="screen active">
        <div class="pair-container">
            <div class="pair-logo">
                <svg viewBox="0 0 64 64" fill="none" width="56" height="56">
                    <defs><linearGradient id="rg" x1="0" y1="0" x2="64" y2="64">
                        <stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#a78bfa"/>
                    </linearGradient></defs>
                    <rect x="4" y="8" width="56" height="40" rx="4" stroke="url(#rg)" stroke-width="3" fill="none"/>
                    <polygon points="26,18 26,38 42,28" fill="url(#rg)"/>
                    <rect x="20" y="52" width="24" height="3" rx="1.5" fill="url(#rg)" opacity="0.6"/>
                </svg>
                <h1>Wilson<span>TV</span></h1>
                <p class="pair-sub">CONTROL REMOTO</p>
            </div>
            <div class="pair-form">
                <label>Ingresa el código de tu TV</label>
                <div class="code-inputs">
                    <input type="tel" maxlength="1" class="code-digit" data-index="0" inputmode="numeric" autocomplete="off">
                    <input type="tel" maxlength="1" class="code-digit" data-index="1" inputmode="numeric" autocomplete="off">
                    <input type="tel" maxlength="1" class="code-digit" data-index="2" inputmode="numeric" autocomplete="off">
                    <input type="tel" maxlength="1" class="code-digit" data-index="3" inputmode="numeric" autocomplete="off">
                </div>
                <button id="btn-connect" class="btn-connect" disabled>Conectar</button>
                <p id="pair-error" class="pair-error"></p>
                <p class="pair-hint">Presiona 📱 <strong>Conectar Celular</strong> en la barra lateral de tu TV para obtener el código</p>
            </div>
        </div>
    </div>

    <!-- ═══════ MAIN CONTROL INTERFACE ═══════ -->
    <div id="screen-remote" class="screen">

        <!-- ─── Status Header ─── -->
        <header class="r-header">
            <div class="r-header-left">
                <span class="r-dot connected"></span>
                <span class="r-header-label" id="r-status-text">Conectado</span>
            </div>
            <div class="r-header-center">
                <div class="r-now-playing" id="r-now-playing">
                    <span class="r-np-label">Reproduciendo</span>
                    <span class="r-np-name" id="r-channel-name">—</span>
                </div>
            </div>
            <div class="r-signal" id="r-signal" title="Calidad de señal">
                <div class="r-signal-bar"></div>
                <div class="r-signal-bar"></div>
                <div class="r-signal-bar"></div>
                <div class="r-signal-bar"></div>
            </div>
            <button id="btn-disconnect" class="r-disconnect" title="Desconectar">✕</button>
        </header>

        <!-- ─── Tab Content Area ─── -->
        <div class="r-tab-content">

            <!-- ═══ TAB: CANALES ═══ -->
            <div id="tab-channels" class="r-tab-panel active">
                <!-- Search -->
                <div class="r-search-wrap">
                    <svg class="r-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                    </svg>
                    <input type="text" id="r-ch-search" placeholder="Buscar entre miles de canales..." autocomplete="off">
                </div>

                <!-- Group Tags -->
                <div class="r-groups-bar" id="r-groups-bar"></div>

                <!-- Channel List -->
                <div class="r-ch-list" id="r-ch-list">
                    <div class="r-ch-empty-state">
                        <div class="r-ch-empty-icon">📡</div>
                        <p>Esperando canales de la TV...</p>
                        <span class="r-ch-empty-sub">Asegúrate de tener una playlist cargada en la TV</span>
                    </div>
                </div>
            </div>

            <!-- ═══ TAB: CONTROL ═══ -->
            <div id="tab-control" class="r-tab-panel">

                <!-- Now Playing Card -->
                <div class="r-np-card" id="r-np-card">
                    <div class="r-np-card-info">
                        <span class="r-np-card-ch" id="r-np-ch-number">—</span>
                        <div class="r-np-card-details">
                            <span class="r-np-card-name" id="r-np-card-name">Ningún canal</span>
                            <span class="r-np-card-group" id="r-np-card-group"></span>
                        </div>
                        <div class="r-np-signal-badge" id="r-np-signal-badge">
                            <span class="r-np-signal-dot"></span>
                            <span class="r-np-signal-text" id="r-np-signal-text">Sin señal</span>
                        </div>
                    </div>
                </div>

                <!-- D-Pad -->
                <div class="dpad-wrap">
                    <div class="dpad">
                        <button class="dp dp-up" data-cmd="navigate" data-dir="up" aria-label="Arriba">
                            <svg viewBox="0 0 24 24" fill="currentColor" width="28" height="28"><path d="M12 4l-8 8h16z"/></svg>
                        </button>
                        <button class="dp dp-left" data-cmd="navigate" data-dir="left" aria-label="Izquierda">
                            <svg viewBox="0 0 24 24" fill="currentColor" width="28" height="28"><path d="M4 12l8-8v16z"/></svg>
                        </button>
                        <button class="dp dp-ok" data-cmd="enter" aria-label="OK">OK</button>
                        <button class="dp dp-right" data-cmd="navigate" data-dir="right" aria-label="Derecha">
                            <svg viewBox="0 0 24 24" fill="currentColor" width="28" height="28"><path d="M20 12l-8-8v16z"/></svg>
                        </button>
                        <button class="dp dp-down" data-cmd="navigate" data-dir="down" aria-label="Abajo">
                            <svg viewBox="0 0 24 24" fill="currentColor" width="28" height="28"><path d="M12 20l8-8H4z"/></svg>
                        </button>
                    </div>
                </div>

                <!-- Quick Actions Row -->
                <div class="r-row-actions">
                    <button class="r-act" data-cmd="back">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="20" height="20"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                        <span>Atrás</span>
                    </button>
                    <button class="r-act" data-cmd="play-pause">
                        <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><polygon points="6,3 20,12 6,21"/></svg>
                        <span>Play</span>
                    </button>
                    <button class="r-act" data-cmd="stop">
                        <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
                        <span>Stop</span>
                    </button>
                </div>

                <!-- Channel & Number Controls -->
                <div class="r-playback">
                    <div class="r-pbl">
                        <button class="r-ch-btn" data-cmd="channel-down">CH−</button>
                        <span class="r-pbl-label">Canal</span>
                        <button class="r-ch-btn" data-cmd="channel-up">CH+</button>
                    </div>
                </div>

                <!-- Number Pad -->
                <details class="r-numpad-wrap" open>
                    <summary class="r-numpad-toggle">Teclado Numérico</summary>
                    <div class="r-numpad">
                        <button class="r-num" data-cmd="number" data-num="1">1</button>
                        <button class="r-num" data-cmd="number" data-num="2">2</button>
                        <button class="r-num" data-cmd="number" data-num="3">3</button>
                        <button class="r-num" data-cmd="number" data-num="4">4</button>
                        <button class="r-num" data-cmd="number" data-num="5">5</button>
                        <button class="r-num" data-cmd="number" data-num="6">6</button>
                        <button class="r-num" data-cmd="number" data-num="7">7</button>
                        <button class="r-num" data-cmd="number" data-num="8">8</button>
                        <button class="r-num" data-cmd="number" data-num="9">9</button>
                        <button class="r-num r-num-special" data-cmd="back">⬅️</button>
                        <button class="r-num" data-cmd="number" data-num="0">0</button>
                        <button class="r-num r-num-special" data-cmd="enter">OK</button>
                    </div>
                </details>

                <!-- Stats -->
                <div class="r-pl-stats" id="r-pl-stats">
                    <div class="r-pl-stat">
                        <span class="r-pl-stat-val" id="r-pl-stat-channels">0</span>
                        <span class="r-pl-stat-label">Canales</span>
                    </div>
                    <div class="r-pl-stat">
                        <span class="r-pl-stat-val" id="r-pl-stat-groups">0</span>
                        <span class="r-pl-stat-label">Grupos</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- ─── Bottom Navigation ─── -->
        <nav class="r-bottom-nav">
            <button class="r-nav-item active" data-tab="channels">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22">
                    <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                </svg>
                <span>Buscar</span>
            </button>
            <button class="r-nav-item" data-tab="control">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22">
                    <circle cx="12" cy="12" r="10"/>
                    <polygon points="10,8 16,12 10,16" fill="currentColor"/>
                </svg>
                <span>Control</span>
            </button>
        </nav>
    </div>

    <!-- Toast Notification -->
    <div id="r-toast" class="r-toast hidden">
        <span id="r-toast-msg"></span>
    </div>

    <script src="js/remote.js?v=8"></script>
</body>
</html>
